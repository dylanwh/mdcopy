name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      KEYCHAIN: build.keychain-db
      NOTARY_PROFILE: mdcopy-notary
      OUTPUT_DIR: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app && xcodebuild -version

      - name: Check tag matches MARKETING_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(xcodebuild -scheme mdcopy -configuration Release -showBuildSettings 2>/dev/null \
            | awk '/ MARKETING_VERSION = /{print $3}')"
          tag="${GITHUB_REF_NAME#v}"
          [ "$version" = "$tag" ] || { echo "Tag v$tag != MARKETING_VERSION $version" >&2; exit 1; }

      - name: Import Developer ID certificates
        env:
          APP_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          INSTALLER_P12: ${{ secrets.DEVELOPER_ID_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          for var in APP_P12 INSTALLER_P12; do
            echo "${!var}" | base64 --decode > cert.p12
            security import cert.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/pkgbuild -T /usr/bin/productbuild -T /usr/bin/security
            rm cert.p12
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Intermediates so the chain validates on a clean runner
          for ca in DeveloperIDG2CA DeveloperIDCA; do
            curl -fsSL "https://www.apple.com/certificateauthority/${ca}.cer" -o "${ca}.cer"
            security import "${ca}.cer" -k "$KEYCHAIN" || true
            rm "${ca}.cer"
          done
          security find-identity -v -p basic "$KEYCHAIN"

      - name: Store notarytool credentials
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "$NOTARY_KEY" > AuthKey.p8
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key AuthKey.p8 --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$HOME/Library/Keychains/$KEYCHAIN"
          rm AuthKey.p8

      - name: Build, sign, notarize, staple
        run: |
          export NOTARY_KEYCHAIN="$HOME/Library/Keychains/$KEYCHAIN"
          ./scripts/create_pkg.sh

      - name: Verify
        run: |
          pkgutil --check-signature dist/*.pkg
          spctl --assess --type install -vv dist/*.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: mdcopy-pkg
          path: dist/*.pkg

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pkg
          generate_release_notes: true

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true
